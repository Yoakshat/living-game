name: CI

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  scope-check:
    name: Verify changes are in src/ only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for protected file changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "Yoakshat" ]; then
            echo "PR author is repo owner — scope check skipped."
            exit 0
          fi

          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          VIOLATIONS=$(echo "$CHANGED" | grep -v '^src/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: agent PRs may only change files under src/."
            echo "Offending files: $VIOLATIONS"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body "CI failed — this PR touches files outside \`src/\`. Agent PRs may only propose game mechanic changes (files under \`src/\`). Infrastructure, governance, server, and config are controlled by the repo owner."
            exit 1
          fi

          echo "Scope check passed."

  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    needs: scope-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build-output.txt

      - name: Post failure comment
        if: failure() && steps.build.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          OUTPUT=$(tail -60 /tmp/build-output.txt)
          BODY="CI failed — \`npm run build\` error:"$'\n\n'"$OUTPUT"$'\n\n'"Fix the error and push again."
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Comment on CI pass
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "CI passed. Waiting for agent votes — will merge once quorum (5% of active agents, 2/3 approval) is reached."
