name: PR Governance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  govern:
    name: Evaluate votes and merge/close PRs
    runs-on: ubuntu-latest

    steps:
      - name: Fetch vote tally
        id: tally
        run: |
          TALLY=$(curl -sf https://living-game-server-production.up.railway.app/vote-tally || echo '')
          if [ -z "$TALLY" ]; then
            echo "Server unreachable — skipping"
            exit 0
          fi
          echo "tally<<EOF" >> $GITHUB_OUTPUT
          echo "$TALLY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Process votes
        if: steps.tally.outputs.tally != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TALLY: ${{ steps.tally.outputs.tally }}
        run: |
          ACTIVE=$(echo "$TALLY" | jq '.activeAgents')
          # quorum = ceil(activeAgents * 0.05), minimum 1
          QUORUM=$(echo "$TALLY" | jq '[(.activeAgents * 0.05 | ceil), 1] | max')
          echo "Active agents: $ACTIVE — quorum needed: $QUORUM"

          SERVER_URL="https://living-game-server-production.up.railway.app"

          # Enforcer timeout in seconds (30 minutes = 1800)
          ENFORCER_TIMEOUT_SECONDS=1800

          echo "$TALLY" | jq -c '.prs[]' | while read -r PR; do
            NUMBER=$(echo "$PR" | jq '.number')
            OPENED_AT=$(echo "$PR" | jq -r '.openedAt')

            # Skip PRs that are already closed/merged on GitHub
            STATE=$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json state -q '.state' 2>/dev/null || echo 'UNKNOWN')
            if [ "$STATE" != "OPEN" ]; then
              continue
            fi

            # --- Enforcer state check (before sync) ---
            ENFORCER_STATE=$(echo "$PR" | jq -r '.enforcerState // "null"')

            # Handle enforcer:block — close the PR
            if [ "$ENFORCER_STATE" = "enforcer:block" ]; then
              ENFORCER_COMMENT=$(echo "$PR" | jq -r '.enforcerComment // "The enforcer determined the diff contained more than mechanical conflict resolution."')
              echo "PR #$NUMBER: enforcer blocked — closing"
              gh pr close "$NUMBER" --repo Yoakshat/living-game \
                --comment "**Enforcer verdict: blocked.** $ENFORCER_COMMENT" || true
              continue
            fi

            # Handle needs-enforcer-review — check for timeout, then skip
            if [ "$ENFORCER_STATE" = "needs-enforcer-review" ]; then
              PENDING_SINCE=$(echo "$PR" | jq -r '.enforcerPendingSince // ""')
              if [ -n "$PENDING_SINCE" ]; then
                PENDING_EPOCH=$(date -d "$PENDING_SINCE" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${PENDING_SINCE%%.*}" +%s 2>/dev/null || echo 0)
                NOW_EPOCH=$(date +%s)
                PENDING_SECONDS=$(( NOW_EPOCH - PENDING_EPOCH ))
                if [ "$PENDING_SECONDS" -ge "$ENFORCER_TIMEOUT_SECONDS" ]; then
                  echo "PR #$NUMBER: enforcer review timed out after ${PENDING_SECONDS}s — closing for safety"
                  gh pr close "$NUMBER" --repo Yoakshat/living-game \
                    --comment "**Enforcer unavailable.** PR closed for safety after waiting $(( PENDING_SECONDS / 60 )) minutes for an enforcer verdict. Re-open and re-vote when the enforcer service is back online." || true
                  continue
                fi
              fi
              echo "PR #$NUMBER: enforcer review pending — waiting (${PENDING_SECONDS:-?}s elapsed)"
              continue
            fi

            # --- Stale branch detection ---
            # Sync the current head SHA with the server. If it changed, the server
            # either wipes all votes (pre-threshold) or transitions to enforcer review.
            CURRENT_SHA=$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json headRefOid -q '.headRefOid' 2>/dev/null || echo '')
            if [ -n "$CURRENT_SHA" ]; then
              SYNC_RESULT=$(curl -sf -X POST "$SERVER_URL/sync-pr" \
                -H 'Content-Type: application/json' \
                -d "{\"prNumber\": $NUMBER, \"sha\": \"$CURRENT_SHA\"}" || echo '{}')
              SYNC_STATUS=$(echo "$SYNC_RESULT" | jq -r '.status // "unknown"')
              if [ "$SYNC_STATUS" = "wiped" ]; then
                echo "PR #$NUMBER: SHA changed to ${CURRENT_SHA:0:7} — votes wiped, agents re-notified"
              elif [ "$SYNC_STATUS" = "enforcer-pending" ]; then
                echo "PR #$NUMBER: SHA changed but votes were at threshold — transitioning to enforcer review"
                continue
              fi
            fi

            # Re-fetch fresh vote counts after sync (votes may have been wiped above)
            FRESH_TALLY=$(curl -sf "$SERVER_URL/vote-tally" || echo '')
            if [ -z "$FRESH_TALLY" ]; then
              echo "PR #$NUMBER: server unreachable after sync — skipping"
              continue
            fi
            FRESH_PR=$(echo "$FRESH_TALLY" | jq -c --argjson num "$NUMBER" '.prs[] | select(.number == $num)' 2>/dev/null || echo '')
            if [ -z "$FRESH_PR" ]; then
              echo "PR #$NUMBER: not found in fresh tally — skipping"
              continue
            fi

            # Re-check enforcer state after sync (sync may have triggered enforcer review)
            FRESH_ENFORCER_STATE=$(echo "$FRESH_PR" | jq -r '.enforcerState // "null"')
            if [ "$FRESH_ENFORCER_STATE" = "needs-enforcer-review" ]; then
              echo "PR #$NUMBER: enforcer review just triggered — waiting"
              continue
            fi

            YES=$(echo "$FRESH_PR" | jq '.yesVotes')
            NO=$(echo "$FRESH_PR" | jq '.noVotes')
            TOTAL=$(echo "$FRESH_PR" | jq '.totalVotes')

            # --- Merge conflict check ---
            # CONFLICTING: block merge, post a comment once, and skip.
            # null/empty: GitHub is still computing — skip this cycle.
            MERGEABLE=$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json mergeable -q '.mergeable' 2>/dev/null || echo '')

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "PR #$NUMBER: branch has conflicts — skipping merge"
              EXISTING=$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json comments \
                -q '[.comments[] | select(.body | contains("branch has conflicts"))] | length' 2>/dev/null || echo '0')
              if [ "$EXISTING" = "0" ]; then
                gh pr comment "$NUMBER" --repo Yoakshat/living-game \
                  --body "branch has conflicts — update and push to restart voting." || true
              fi
              continue
            fi

            if [ "$MERGEABLE" = "null" ] || [ -z "$MERGEABLE" ]; then
              echo "PR #$NUMBER: mergeable status unknown (still computing) — skipping this cycle"
              continue
            fi

            # --- CI check ---
            CI=$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json statusCheckRollup -q '
              if (.statusCheckRollup | length) == 0 then "pending"
              elif [.statusCheckRollup[].conclusion] | any(. == "FAILURE" or . == "TIMED_OUT" or . == "CANCELLED") then "failed"
              elif [.statusCheckRollup[].status] | any(. == "IN_PROGRESS" or . == "QUEUED") then "pending"
              else "passed"
              end
            ' 2>/dev/null || echo 'pending')

            if [ "$CI" = "failed" ]; then
              echo "PR #$NUMBER: CI failed — closing"
              gh pr close "$NUMBER" --repo Yoakshat/living-game \
                --comment "Closing — CI failed. Fix the build errors and resubmit." || true
              continue
            fi

            if [ "$CI" = "pending" ]; then
              echo "PR #$NUMBER: CI still running — skipping"
              continue
            fi

            echo "PR #$NUMBER: yes=$YES no=$NO total=$TOTAL (quorum=$QUORUM) enforcer=$FRESH_ENFORCER_STATE"

            # Handle enforcer:approve — treat as normally approved, proceed to merge check
            if [ "$FRESH_ENFORCER_STATE" = "enforcer:approve" ]; then
              echo "PR #$NUMBER: enforcer approved — proceeding to merge"
              gh pr merge "$NUMBER" --repo Yoakshat/living-game --squash \
                --subject "$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json title -q '.title') (#$NUMBER)" || true
              continue
            fi

            if [ "$TOTAL" -ge "$QUORUM" ]; then
              # 2/3 approval: yes * 3 >= total * 2
              if [ $((YES * 3)) -ge $((TOTAL * 2)) ]; then
                echo "  → Approved ($YES/$TOTAL) — merging"
                gh pr merge "$NUMBER" --repo Yoakshat/living-game --squash \
                  --subject "$(gh pr view "$NUMBER" --repo Yoakshat/living-game --json title -q '.title') (#$NUMBER)" || true
              else
                echo "  → Rejected ($YES/$TOTAL) — closing"
                gh pr close "$NUMBER" --repo Yoakshat/living-game \
                  --comment "Vote closed: **$YES yes / $NO no** ($TOTAL votes cast, quorum was $QUORUM). Approval rate below 2/3 — closing. Fix and resubmit when ready." || true
              fi
            else
              # Stale check: 48h without reaching quorum
              OPENED_EPOCH=$(date -d "$OPENED_AT" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date +%s)
              AGE_HOURS=$(( (NOW_EPOCH - OPENED_EPOCH) / 3600 ))
              if [ "$AGE_HOURS" -ge 48 ]; then
                echo "  → Stale (${AGE_HOURS}h, $TOTAL/$QUORUM votes) — closing"
                gh pr close "$NUMBER" --repo Yoakshat/living-game \
                  --comment "Closed after ${AGE_HOURS}h with insufficient participation ($TOTAL of $QUORUM needed votes cast). Resubmit when more agents are active." || true
              fi
            fi
          done
